<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>천록 | AR 뷰어</title>

  <!-- model-viewer 라이브러리 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <style>
    /* 기본 리셋 */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 컬러 변수 */
    :root {
      --ink: #1a1209;
      --paper: #f5efe4;
      --gold: #b8943f;
      --gold-light: #d4af60;
      --brush: #3d2b1a;
    }

    /* 전체 화면 기본 설정 */
    html, body {
      width: 100%; height: 100%;
      background: var(--ink);
      overflow: hidden;
      font-family: 'Pretendard', sans-serif;
    }

    /* 배경 그라디언트 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(184,148,63,0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(61,43,26,0.6) 0%, transparent 60%),
        linear-gradient(160deg, #0e0c08 0%, #1a1209 50%, #0b0906 100%);
      z-index: 0;
    }

    /* 3D/AR 뷰어 전체화면 */
    model-viewer {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      background: transparent;
      z-index: 1;
      --poster-color: transparent;
    }

    /* 상단 타이틀 오버레이 */
    .title-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 28px 32px 20px;
      background: linear-gradient(to bottom, rgba(14,12,8,0.85) 0%, transparent 100%);
      pointer-events: none;
    }

    .title-label {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    .title-main {
      font-size: clamp(16px, 4vw, 22px);
      color: var(--paper);
      font-weight: 400;
      letter-spacing: 0.05em;
      line-height: 1.3;
    }

    .title-sub {
      font-size: 11px;
      color: rgba(245,239,228,0.45);
      margin-top: 4px;
      letter-spacing: 0.1em;
    }

    /* 금 장식선 */
    .deco-line {
      width: 32px; height: 1px;
      background: var(--gold);
      margin: 10px 0 6px;
      opacity: 0.6;
    }

    /* PC 전용 안내 메시지 */
    .desktop-notice {
      display: none;
      position: fixed;
      bottom: 36px; left: 50%; transform: translateX(-50%);
      z-index: 10;
      background: rgba(14,12,8,0.82);
      border: 1px solid rgba(184,148,63,0.35);
      border-radius: 40px;
      padding: 12px 24px;
      color: rgba(245,239,228,0.75);
      font-size: 13px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .desktop-notice::before {
      content: '📱 ';
    }

    /* AR 실행 버튼 (모바일에서만 표시됨) */
    #ar-button {
      position: absolute;
      bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--gold);
      color: var(--ink);
      border: none;
      border-radius: 40px;
      padding: 14px 36px;
      font-family: 'Pretendard', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(184,148,63,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
      box-shadow: 0 2px 10px rgba(184,148,63,0.25);
    }

    /* 하단 로딩 프로그레스바 */
    .progress-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 2px;
      background: var(--gold);
      transition: width 0.3s ease;
      z-index: 20;
      width: 0%;
    }

    /* PC에서만 안내 메시지 표시 */
    @media (hover: hover) and (pointer: fine) {
      .desktop-notice { display: block; }
    }
  </style>
</head>
<body>

  <!-- 상단 타이틀 -->
  <div class="title-overlay">
    <div class="title-label">AR 뷰어 · K-Heritage</div>
    <div class="deco-line"></div>
    <div class="title-main">천록 AR 뷰어</div>
    <div class="title-sub">경복궁 속 상상의 동물</div>
  </div>

  <!-- 3D/AR 뷰어 -->
  <model-viewer
    id="viewer"
    src="assets/test.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    camera-controls
    auto-rotate
    autoplay
    shadow-intensity="1"
    exposure="1"
    poster=""
    loading="eager"
  >
    <!-- AR 실행 버튼 -->
    <button slot="ar-button" id="ar-button">AR로 감상하기</button>
  </model-viewer>

  <!-- PC 접속 안내 -->
  <div class="desktop-notice">모바일에서 접속하면 AR로 체험할 수 있습니다</div>

  <!-- 로딩 프로그레스바 -->
  <div class="progress-bar" id="progress-bar"></div>

  <script>
    const viewer = document.getElementById('viewer');
    const bar = document.getElementById('progress-bar');

    /* 로딩 진행률 표시 */
    viewer.addEventListener('progress', (e) => {
      const pct = Math.round(e.detail.totalProgress * 100);
      bar.style.width = pct + '%';
      if (pct >= 100) {
        setTimeout(() => { bar.style.opacity = '0'; }, 600);
      }
    });

    /* 모델 로드 완료 시 애니메이션 재생 */
    viewer.addEventListener('load', () => {
      viewer.animationName = 'Skin:root';
      viewer.play();
    });

    /* AR 진입/종료 처리 */
    // const audioSrc = 'assets/01.dani.wav'; // 오디오 파일 경로 (사용 시 주석 해제)
    let audio = null;

    viewer.addEventListener('ar-status', (e) => {

      /* AR 시작 시: 애니메이션 재생 + 오디오 재생 */
      if (e.detail.status === 'session-started') {
        viewer.animationName = 'Skin:root';
        viewer.play();
        // if (!audio) audio = new Audio(audioSrc);
        // audio.currentTime = 0;
        // audio.play().catch(() => {});
      }

      /* AR 종료 시: 오디오 정지 */
      if (e.detail.status === 'not-presenting') {
        // if (audio) { audio.pause(); audio.currentTime = 0; }
      }

    });
      /* AR 버튼 클릭 시 애니메이션 미리 세팅 */
document.getElementById('ar-button').addEventListener('click', () => {
  viewer.animationName = 'Skin:root';
  viewer.play();
});
  </script>

</body>
</html>
