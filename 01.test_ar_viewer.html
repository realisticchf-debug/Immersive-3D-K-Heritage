<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소리꾼과 미인도 엔딩 | AR 뷰어</title>

  <!-- model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1209;
      --paper: #f5efe4;
      --gold: #b8943f;
      --gold-light: #d4af60;
      --brush: #3d2b1a;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--ink);
      overflow: hidden;
      font-family: 'Noto Serif KR', 'Georgia', serif;
    }

    /* 배경 텍스처 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(184,148,63,0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(61,43,26,0.6) 0%, transparent 60%),
        linear-gradient(160deg, #0e0c08 0%, #1a1209 50%, #0b0906 100%);
      z-index: 0;
    }

    /* model-viewer 전체화면 */
    model-viewer {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      background: transparent;
      z-index: 1;
      --poster-color: transparent;
    }

    /* 상단 타이틀 오버레이 */
    .title-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 28px 32px 20px;
      background: linear-gradient(to bottom, rgba(14,12,8,0.85) 0%, transparent 100%);
      pointer-events: none;
    }

    .title-label {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    .title-main {
      font-size: clamp(16px, 4vw, 22px);
      color: var(--paper);
      font-weight: 400;
      letter-spacing: 0.05em;
      line-height: 1.3;
    }

    .title-sub {
      font-size: 11px;
      color: rgba(245,239,228,0.45);
      margin-top: 4px;
      letter-spacing: 0.1em;
    }

    /* 금 장식선 */
    .deco-line {
      width: 32px; height: 1px;
      background: var(--gold);
      margin: 10px 0 6px;
      opacity: 0.6;
    }

    /* 하단 안내 (PC 전용) */
    .desktop-notice {
      display: none;
      position: fixed;
      bottom: 36px; left: 50%; transform: translateX(-50%);
      z-index: 10;
      background: rgba(14,12,8,0.82);
      border: 1px solid rgba(184,148,63,0.35);
      border-radius: 40px;
      padding: 12px 24px;
      color: rgba(245,239,228,0.75);
      font-size: 13px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .desktop-notice::before {
      content: '📱 ';
    }

    /* AR 버튼 커스텀 스타일 (model-viewer slot) */
    #ar-button {
      position: absolute;
      bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--gold);
      color: var(--ink);
      border: none;
      border-radius: 40px;
      padding: 14px 36px;
      font-family: 'Noto Serif KR', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(184,148,63,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
      box-shadow: 0 2px 10px rgba(184,148,63,0.25);
    }

    /* 로딩 프로그레스바 */
    .progress-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 2px;
      background: var(--gold);
      transition: width 0.3s ease;
      z-index: 20;
      width: 0%;
    }

    /* PC에서는 AR 버튼 숨김 처리는 model-viewer가 자동으로 함 */
    @media (hover: hover) and (pointer: fine) {
      .desktop-notice { display: block; }
    }
  </style>

  <!-- 한국어 세리프 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" />
</head>
<body>

  <!-- 타이틀 오버레이 -->
  <div class="title-overlay">
    <div class="title-label">AR 뷰어 · K-Heritage</div>
    <div class="deco-line"></div>
    <div class="title-main">소리꾼과 미인도 엔딩</div>
    <div class="title-sub">VR영화 〈단이전: 미인도 이야기〉</div>
  </div>

  <!-- model-viewer -->
  <model-viewer
    id="viewer"
    src="assets/04.banghwa.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    poster=""
    loading="eager"
  >
    <!-- AR 버튼 슬롯 -->
    <button slot="ar-button" id="ar-button">AR로 감상하기</button>
  </model-viewer>

  <!-- PC 안내 메시지 -->
  <div class="desktop-notice">모바일에서 접속하면 AR로 체험할 수 있습니다</div>

  <!-- 로딩 프로그레스바 -->
  <div class="progress-bar" id="progress-bar"></div>

  <script>
    const viewer = document.getElementById('viewer');
    const bar = document.getElementById('progress-bar');

    // 로딩 진행률
    viewer.addEventListener('progress', (e) => {
      const pct = Math.round(e.detail.totalProgress * 100);
      bar.style.width = pct + '%';
      if (pct >= 100) {
        setTimeout(() => { bar.style.opacity = '0'; }, 600);
      }
    });

    // AR 시작 시 오디오 자동재생
    //const audioSrc = 'assets/01.dani.wav';
    let audio = null;

    viewer.addEventListener('ar-status', (e) => {
      if (e.detail.status === 'session-started') {
        if (!audio) {
          audio = new Audio(audioSrc);
          audio.loop = false;
        }
        audio.currentTime = 0;
        audio.play().catch(() => {
          // 브라우저 정책으로 차단될 경우 무시
        });
      }
      if (e.detail.status === 'not-presenting') {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      }
    });
  </script>

</body>
</html>
